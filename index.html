<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — Free Online Tools: Word Counter, QR Generator, Password Generator & More</title>
<meta name="description" content="Free everyday tools that run in your browser: word counter, QR code generator, password generator, unit converter, image resizer, video to audio converter, and background remover. No sign-up, no uploads to a server.">
<link rel="canonical" href="https://REPLACE_WITH_YOUR_DOMAIN/index.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="home-view">
  <div class="logo">
    <img src="logo-header.svg" alt="Forge" class="logo-mark-img">
    <div class="logo-text">FORGE<span>.</span></div>
  </div>

  <div class="home-center">
    <div class="home-heading">
      <h1>Small tools for everyday busywork.</h1>
      <p>// RUNS IN YOUR BROWSER · NOTHING IS UPLOADED</p>
    </div>

    <div class="card-grid">
      <a class="tool-card card-1" href="word-counter.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
        <div class="name">Word Counter</div>
      </a>
      <div class="tool-card card-2" id="qr-card-trigger" role="button" tabindex="0">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z" stroke="none" fill="currentColor"/></svg>
        <div class="name">QR Code</div>
      </div>
      <div id="qr-choice-popover" class="hidden popover-overlay">
        <div class="popover-box">
          <h3>QR Code</h3>
          <a class="action brass" href="qr-generator.html" style="display:block; text-decoration:none; box-sizing:border-box;">Generate QR code</a>
          <a class="action" href="scan.html" style="display:block; text-decoration:none; box-sizing:border-box; margin-top:10px;">Scan</a>
          <button class="popover-close" id="qr-choice-close" style="margin-top:14px;">Cancel</button>
        </div>
      </div>
      <a class="tool-card card-3" href="password-generator.html">
        <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round"/></svg>
        <div class="name">Password Generator</div>
      </a>
      <a class="tool-card card-4" href="unit-converter.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="name">Unit Converter</div>
      </a>
      <a class="tool-card card-5" href="image-resizer.html">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 15l-5-5-9 8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="name">Image Resizer</div>
      </a>
      <a class="tool-card card-6" href="video-to-audio-converter.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 13h2l2-7 3 15 3-11 2 5h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="name">Audio Converter</div>
      </a>
      <a class="tool-card card-7" href="background-remover.html">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M20.5 4.5L8.5 14.5M14.8 14.3l5.7 5.7M8.5 9.5l3 2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="name">Background Remover</div>
      </a>
      <a class="tool-card card-8" href="memo.html">
        <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4" stroke-linecap="round"/></svg>
        <div class="name">Memo</div>
      </a>
    </div>
  </div>
</div>

<script>
const qrTrigger = document.getElementById('qr-card-trigger');
const qrPopover = document.getElementById('qr-choice-popover');
qrTrigger.addEventListener('click', ()=> qrPopover.classList.remove('hidden'));
qrTrigger.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') qrPopover.classList.remove('hidden'); });
document.getElementById('qr-choice-close').addEventListener('click', ()=> qrPopover.classList.add('hidden'));
qrPopover.addEventListener('click', (e)=>{ if(e.target === qrPopover) qrPopover.classList.add('hidden'); });
</script>

</body>
</html>
