<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Strong Password Generator — Secure & Random | Forge</title>
<meta name="description" content="Generate a strong, random, secure password with custom length and character types. Uses your browser's cryptographic random generator — nothing is stored or sent anywhere.">
<link rel="canonical" href="https://REPLACE_WITH_YOUR_DOMAIN/password-generator.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body class="tool-page">

<div class="tool-topbar">
  <a class="back-btn" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Home
  </a>
  <span class="tt-name">Password Generator</span>
</div>

<div class="tool-body">
<section class="tool-panel" id="tool-password">
      <h2>Password Generator</h2>
      <p class="desc">Build a strong, random password. Nothing here is stored or sent anywhere.</p>
      <div class="pw-output" id="pw-output">Click generate below</div>
      <div class="range-row">
        <label style="margin:0; min-width:60px;">Length</label>
        <input type="range" id="pw-length" min="6" max="48" value="16">
        <span class="range-val" id="pw-length-val">16</span>
      </div>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="pw-upper" checked> Uppercase letters (A–Z)</label>
        <label class="chk"><input type="checkbox" id="pw-lower" checked> Lowercase letters (a–z)</label>
        <label class="chk"><input type="checkbox" id="pw-numbers" checked> Numbers (0–9)</label>
        <label class="chk"><input type="checkbox" id="pw-symbols"> Symbols (!@#$%…)</label>
      </div>
      <div style="display:flex; gap:12px;">
        <button class="action brass" id="pw-generate">Generate password</button>
        <button class="action" id="pw-copy">Copy</button>
      </div>
    </section>
</div>

<script>
/* ---------- PASSWORD GENERATOR ---------- */
const pwLength = document.getElementById('pw-length');
const pwLengthVal = document.getElementById('pw-length-val');
pwLength.addEventListener('input', ()=> pwLengthVal.textContent = pwLength.value);

function generatePassword(){
  const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const lower = 'abcdefghijkmnpqrstuvwxyz';
  const numbers = '23456789';
  const symbols = '!@#$%^&*_-+=?';
  let pool = '';
  if(document.getElementById('pw-upper').checked) pool += upper;
  if(document.getElementById('pw-lower').checked) pool += lower;
  if(document.getElementById('pw-numbers').checked) pool += numbers;
  if(document.getElementById('pw-symbols').checked) pool += symbols;
  if(!pool){ document.getElementById('pw-output').textContent = 'Select at least one character type'; return; }
  const len = parseInt(pwLength.value);
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let result = '';
  for(let i=0;i<len;i++) result += pool[arr[i] % pool.length];
  document.getElementById('pw-output').textContent = result;
}
document.getElementById('pw-generate').addEventListener('click', generatePassword);
document.getElementById('pw-copy').addEventListener('click', ()=>{
  const txt = document.getElementById('pw-output').textContent;
  if(txt && txt !== 'Click generate below'){
    navigator.clipboard.writeText(txt);
    const btn = document.getElementById('pw-copy');
    const old = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=> btn.textContent = old, 1200);
  }
});
generatePassword();

</script>

</body>
</html>
