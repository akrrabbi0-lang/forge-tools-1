<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Video to Audio Converter Online — No Upload | Forge</title>
<meta name="description" content="Convert any video to an MP3 audio file for free, directly in your browser. No file upload to a server, no software install, no sign-up required.">
<link rel="canonical" href="https://REPLACE_WITH_YOUR_DOMAIN/video-to-audio-converter.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body class="tool-page">

<div class="tool-topbar">
  <a class="back-btn" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Home
  </a>
  <span class="tt-name">Audio Converter</span>
</div>

<div class="tool-body">
<section class="tool-panel" id="tool-audio">
      <h2>Video to Audio Converter</h2>
      <p class="desc">Upload a video file and pull out the audio as a WAV file. Uses your browser's built-in audio engine — no external library to load, and the file never leaves your device.</p>
      <div class="drop-zone" id="audio-drop">Click to choose a video file, or drag one here</div>
      <input type="file" id="audio-file" accept="video/*" class="hidden">
      <p id="audio-filename" style="font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--slate); margin-bottom:16px;"></p>
      <button class="action brass hidden" id="audio-convert">Extract audio</button>
      <p id="audio-status" style="margin-top:16px; font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--slate);"></p>
      <audio id="audio-preview" controls class="hidden" style="width:100%; max-width:420px; margin-top:12px; display:block;"></audio>
      <button class="action hidden" id="audio-download" style="margin-top:12px;">Download WAV</button>
    </section>
</div>

<script>
/* ---------- AUDIO CONVERTER (video -> WAV, pure Web Audio API, no external library) ---------- */
let audioFile = null;

const audioDrop = document.getElementById('audio-drop');
const audioFileInput = document.getElementById('audio-file');
audioDrop.addEventListener('click', ()=> audioFileInput.click());
audioDrop.addEventListener('dragover', e=>{ e.preventDefault(); audioDrop.classList.add('dragover'); });
audioDrop.addEventListener('dragleave', ()=> audioDrop.classList.remove('dragover'));
audioDrop.addEventListener('drop', e=>{
  e.preventDefault();
  audioDrop.classList.remove('dragover');
  if(e.dataTransfer.files.length) handleAudioFile(e.dataTransfer.files[0]);
});
audioFileInput.addEventListener('change', e=>{
  if(e.target.files.length) handleAudioFile(e.target.files[0]);
});
function handleAudioFile(file){
  audioFile = file;
  const sizeMB = file.size/1024/1024;
  document.getElementById('audio-filename').textContent = `Selected: ${file.name} (${sizeMB.toFixed(1)} MB)`;
  document.getElementById('audio-convert').classList.remove('hidden');
  document.getElementById('audio-download').classList.add('hidden');
  document.getElementById('audio-preview').classList.add('hidden');
  const statusEl = document.getElementById('audio-status');
  if(sizeMB > 500){
    statusEl.textContent = 'This file is quite large — your browser may run out of memory. A file under 300MB works best.';
  } else {
    statusEl.textContent = '';
  }
}

// Encode a decoded AudioBuffer into a 16-bit PCM WAV Blob
function audioBufferToWav(buffer){
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  const bytesPerSample = 2;
  const blockAlign = numChannels * bytesPerSample;
  const dataSize = numFrames * blockAlign;
  const bufferSize = 44 + dataSize;

  const arrayBuffer = new ArrayBuffer(bufferSize);
  const view = new DataView(arrayBuffer);

  function writeString(offset, str){
    for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i));
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  const channelData = [];
  for(let ch=0; ch<numChannels; ch++) channelData.push(buffer.getChannelData(ch));

  let offset = 44;
  for(let i=0; i<numFrames; i++){
    for(let ch=0; ch<numChannels; ch++){
      let sample = Math.max(-1, Math.min(1, channelData[ch][i]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
      view.setInt16(offset, sample, true);
      offset += 2;
    }
  }

  return new Blob([arrayBuffer], { type: 'audio/wav' });
}

let audioResultUrl = null;
document.getElementById('audio-convert').addEventListener('click', async ()=>{
  if(!audioFile) return;
  const statusEl = document.getElementById('audio-status');
  const btn = document.getElementById('audio-convert');
  btn.disabled = true;

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if(!AudioCtx){
    statusEl.textContent = 'Your browser does not support the Web Audio API needed for this tool. Try an up-to-date Chrome, Firefox, or Edge.';
    btn.disabled = false;
    return;
  }

  try{
    statusEl.textContent = 'Reading file…';
    const arrayBuffer = await audioFile.arrayBuffer();

    statusEl.textContent = 'Decoding audio track…';
    const audioCtx = new AudioCtx();
    const decoded = await new Promise((resolve, reject)=>{
      // decodeAudioData supports both promise and legacy callback forms; using both for max compatibility
      const maybePromise = audioCtx.decodeAudioData(arrayBuffer.slice(0), resolve, reject);
      if(maybePromise && typeof maybePromise.then === 'function'){
        maybePromise.then(resolve).catch(reject);
      }
    });

    statusEl.textContent = 'Encoding WAV file…';
    const blob = audioBufferToWav(decoded);
    audioResultUrl = URL.createObjectURL(blob);
    statusEl.textContent = `Done — extracted ${decoded.duration.toFixed(1)}s of audio.`;
    const previewEl = document.getElementById('audio-preview');
    previewEl.src = audioResultUrl;
    previewEl.classList.remove('hidden');
    document.getElementById('audio-download').classList.remove('hidden');
    audioCtx.close();
  } catch(err){
    statusEl.textContent = 'Could not extract audio from this file (' + (err && err.message ? err.message : 'unsupported format') + '). Try a standard MP4 or MOV video.';
    console.error(err);
  }
  btn.disabled = false;
});
document.getElementById('audio-download').addEventListener('click', ()=>{
  if(!audioResultUrl) return;
  const link = document.createElement('a');
  link.download = 'extracted-audio.wav';
  link.href = audioResultUrl;
  link.click();
});

</script>

</body>
</html>
