<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free zakat calculator based on the nisab threshold.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Zakat Calculator — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="calculators.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">Zakat Calculator</span>
</div>
<div class="wrap">
  <h1>Zakat Calculator</h1>
  <p class="sub">Enter your assets and we'll work out zakat (2.5%) against the nisab. Enter today's gold/silver rate yourself.</p>

  <div class="panel">
    <label>Cash in hand / bank</label>
    <input type="number" id="zCash" placeholder="0">

    <div class="row">
      <div><label>Gold amount (grams)</label><input type="number" id="zGoldG" placeholder="0"></div>
      <div><label>Today's gold rate (per gram)</label><input type="number" id="zGoldRate" placeholder="e.g. 12000"></div>
    </div>
    <div class="row">
      <div><label>Silver amount (grams)</label><input type="number" id="zSilverG" placeholder="0"></div>
      <div><label>Today's silver rate (per gram)</label><input type="number" id="zSilverRate" placeholder="e.g. 150"></div>
    </div>
    <label>Other zakatable assets (business goods, shares, etc.)</label>
    <input type="number" id="zOther" placeholder="0">
    <label>Debts owed (to be repaid)</label>
    <input type="number" id="zDebt" placeholder="0">

    <button class="btn" id="zBtn">Calculate zakat</button>
    <div class="error-text" id="zError" style="display:none"></div>
    <div class="result" id="zResult" style="display:none"></div>
    <p class="muted-note">Nisab is calculated using the silver standard (value of 612.36g of silver) — the threshold that applies to most people.</p>
  </div>
</div>

<script src="common.js"></script>
<script>
const zBtn = document.getElementById('zBtn');
const zError = document.getElementById('zError');
const zResult = document.getElementById('zResult');

zBtn.onclick = ()=>{
  const cash = parseFloat(document.getElementById('zCash').value)||0;
  const goldG = parseFloat(document.getElementById('zGoldG').value)||0;
  const goldRate = parseFloat(document.getElementById('zGoldRate').value)||0;
  const silverG = parseFloat(document.getElementById('zSilverG').value)||0;
  const silverRate = parseFloat(document.getElementById('zSilverRate').value)||0;
  const other = parseFloat(document.getElementById('zOther').value)||0;
  const debt = parseFloat(document.getElementById('zDebt').value)||0;

  if(!silverRate){ showError(zError, "Today's silver rate is needed to work out the nisab"); zResult.style.display='none'; return; }
  clearMsg(zError);

  const goldValue = goldG * goldRate;
  const silverValue = silverG * silverRate;
  const totalWealth = cash + goldValue + silverValue + other - debt;
  const nisab = 612.36 * silverRate;
  const eligible = totalWealth >= nisab;
  const zakat = eligible ? totalWealth * 0.025 : 0;

  zResult.style.display='none'; void zResult.offsetWidth; zResult.style.display='block';
  zResult.innerHTML = `
    <div class="stat-row"><span class="k">Total zakatable wealth</span><span class="v">৳${totalWealth.toFixed(2)}</span></div>
    <div class="stat-row"><span class="k">Nisab (612.36g silver)</span><span class="v">৳${nisab.toFixed(2)}</span></div>
    <div class="stat-row"><span class="k">Above the nisab?</span><span class="v">${eligible ? 'Yes' : 'No'}</span></div>
    <div class="stat-row"><span class="k">Zakat due (2.5%)</span><span class="v">৳${zakat.toFixed(2)}</span></div>
  `;
};
onEnter([document.getElementById('zCash'),document.getElementById('zGoldG'),document.getElementById('zGoldRate'),document.getElementById('zSilverG'),document.getElementById('zSilverRate'),document.getElementById('zOther'),document.getElementById('zDebt')], zBtn);
</script>
</body>
</html>
