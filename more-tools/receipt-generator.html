<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free tool to make a printable receipt or voucher for a shop or small transaction.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Receipt / Voucher Generator — Forge</title>
<link rel="stylesheet" href="style.css">
<style>
  @media print{
    body *{visibility:hidden;}
    #rPreview, #rPreview *{visibility:visible;}
    #rPreview{position:absolute;top:0;left:0;width:100%;margin:0;border:none;}
  }
</style>
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">Receipt / Voucher Generator</span>
</div>
<div class="wrap">
  <h1>Receipt / Voucher Generator</h1>
  <p class="sub">Make a printable receipt for a shop or small transaction.</p>

  <div class="panel">
    <label>Shop / business name</label>
    <input type="text" id="rShop" placeholder="e.g. Rahman Store">
    <label>Customer name (optional)</label>
    <input type="text" id="rCust" placeholder="">
    <label>Item list</label>
    <div class="receipt-lines" id="rLines"></div>
    <button class="btn ghost" id="rAddLine" type="button">+ Add item</button>
    <button class="btn" id="rGenBtn">Generate receipt</button>
    <div class="receipt-preview" id="rPreview" style="display:none"></div>
    <button class="btn ghost" id="rPrintBtn" type="button" style="display:none">🖨 Print</button>
  </div>
</div>

<script src="common.js"></script>
<script>
const linesWrap = document.getElementById('rLines');
function addLine(){
  const row = document.createElement('div');
  row.className='receipt-line';
  row.innerHTML = `<input type="text" placeholder="Item name" class="itm"><input type="number" placeholder="Price" class="amt"><button type="button" class="remove-row-btn" title="Remove">✕</button>`;
  row.querySelector('.remove-row-btn').onclick = ()=>{
    if(linesWrap.children.length > 1) row.remove();
  };
  linesWrap.appendChild(row);
}
addLine(); addLine(); addLine();
document.getElementById('rAddLine').onclick = addLine;

const rGenBtn = document.getElementById('rGenBtn');
rGenBtn.onclick = ()=>{
  const shop = document.getElementById('rShop').value.trim() || 'Shop Name';
  const cust = document.getElementById('rCust').value.trim();
  const items = Array.from(linesWrap.querySelectorAll('.receipt-line')).map(r=>{
    const name = r.querySelector('.itm').value.trim();
    const amt = parseFloat(r.querySelector('.amt').value) || 0;
    return {name, amt};
  }).filter(i=>i.name);
  const total = items.reduce((s,i)=>s+i.amt,0);
  const date = new Date().toLocaleDateString('en-GB');
  let out = `${shop}\n${'-'.repeat(28)}\n`;
  if(cust) out += `Customer: ${cust}\n`;
  out += `Date: ${date}\n${'-'.repeat(28)}\n`;
  items.forEach(i=> out += `${i.name.padEnd(18)} ${('৳'+i.amt.toFixed(2)).padStart(9)}\n`);
  out += `${'-'.repeat(28)}\nTotal: ৳${total.toFixed(2)}\n${'-'.repeat(28)}\nThank you!`;
  const prev = document.getElementById('rPreview');
  prev.style.display='none'; void prev.offsetWidth; prev.style.display='block';
  prev.textContent = out;
  document.getElementById('rPrintBtn').style.display = items.length ? 'inline-flex' : 'none';
};
document.getElementById('rPrintBtn').onclick = ()=> window.print();
onEnter([document.getElementById('rShop'), document.getElementById('rCust')], rGenBtn);
</script>
</body>
</html>
