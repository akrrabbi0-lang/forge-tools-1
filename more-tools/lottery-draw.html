<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pick a random winner from a list of names or a number range — a lottery / raffle draw tool.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Lottery / Raffle Draw — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">Lottery / Raffle Draw</span>
</div>
<div class="wrap">
  <h1>Lottery / Raffle Draw</h1>
  <p class="sub">Pick a random winner from a list of names or a number range.</p>

  <div class="panel">
    <label>List of names (comma-separated), or leave blank and use the range below</label>
    <textarea id="drawNames" placeholder="Rahim, Karim, Sakib, Nadia"></textarea>
    <div class="row">
      <div><label>Range start</label><input type="number" id="drawMin" placeholder="1"></div>
      <div><label>Range end</label><input type="number" id="drawMax" placeholder="100"></div>
    </div>
    <button class="btn" id="drawBtn">Draw</button>
    <div class="result" id="drawResult" style="display:none"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
let lastNameWinner = null;
let lastNumberWinner = null;

document.getElementById('drawBtn').onclick = ()=>{
  const namesRaw = document.getElementById('drawNames').value.trim();
  const res = document.getElementById('drawResult');
  res.style.display='none'; void res.offsetWidth; res.style.display='block';
  res.className = 'result';
  if(namesRaw){
    const names = namesRaw.split(',').map(s=>s.trim()).filter(Boolean);
    if(names.length===0){ res.className='error-text'; res.innerHTML = 'Enter at least one name'; return; }
    let winner = names[rand(names.length)];
    if(names.length>1){
      let tries=0;
      while(winner===lastNameWinner && tries<20){ winner = names[rand(names.length)]; tries++; }
    }
    lastNameWinner = winner;
    res.innerHTML = `<div class="name-item">Winner: <strong>${winner}</strong></div>`;
  } else {
    const min = parseInt(document.getElementById('drawMin').value)||1;
    const max = parseInt(document.getElementById('drawMax').value)||100;
    let winner = min + rand(max-min+1);
    if(max>min){
      let tries=0;
      while(winner===lastNumberWinner && tries<20){ winner = min + rand(max-min+1); tries++; }
    }
    lastNumberWinner = winner;
    res.innerHTML = `<div class="name-item">Winning number: <strong>${winner}</strong></div>`;
  }
};
onEnter([document.getElementById('drawMin'), document.getElementById('drawMax')], document.getElementById('drawBtn'));
</script>
</body>
</html>
