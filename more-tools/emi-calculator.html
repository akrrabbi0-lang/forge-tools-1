<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free calculator for a loan's monthly installment (EMI), total interest, and total repayment.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>EMI / Loan Calculator — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="calculators.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">EMI / Loan Calculator</span>
</div>
<div class="wrap">
  <h1>EMI / Loan Calculator</h1>
  <p class="sub">Enter the loan amount, interest rate, and term to get the monthly installment.</p>

  <div class="panel">
    <label>Loan amount (BDT)</label>
    <input type="number" id="emiAmount" placeholder="e.g. 500000">
    <div class="row">
      <div><label>Annual interest rate (%)</label><input type="number" id="emiRate" placeholder="e.g. 12" step="0.1"></div>
      <div><label>Term (years)</label><input type="number" id="emiYears" placeholder="e.g. 5"></div>
    </div>
    <button class="btn" id="emiBtn">Calculate EMI</button>
    <div class="error-text" id="emiError" style="display:none"></div>
    <div class="result" id="emiResult" style="display:none"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const emiBtn = document.getElementById('emiBtn');
const emiError = document.getElementById('emiError');
const emiResult = document.getElementById('emiResult');
const emiInputs = [document.getElementById('emiAmount'), document.getElementById('emiRate'), document.getElementById('emiYears')];

emiBtn.onclick = ()=>{
  const P = parseFloat(document.getElementById('emiAmount').value);
  const annualRate = parseFloat(document.getElementById('emiRate').value);
  const years = parseFloat(document.getElementById('emiYears').value);
  if(!P || !annualRate || !years){ showError(emiError, 'Please fill in every field'); emiResult.style.display='none'; return; }
  clearMsg(emiError);

  const n = years * 12;
  const r = annualRate / 12 / 100;
  const emi = r === 0 ? P/n : P * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
  const totalPay = emi * n;
  const totalInterest = totalPay - P;

  emiResult.style.display='none'; void emiResult.offsetWidth; emiResult.style.display='block';
  emiResult.innerHTML = `
    <div class="stat-row"><span class="k">Monthly installment (EMI)</span><span class="v">৳${emi.toFixed(2)}</span></div>
    <div class="stat-row"><span class="k">Total repayment</span><span class="v">৳${totalPay.toFixed(2)}</span></div>
    <div class="stat-row"><span class="k">Total interest</span><span class="v">৳${totalInterest.toFixed(2)}</span></div>
  `;
};
onEnter(emiInputs, emiBtn);
</script>
</body>
</html>
