<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Enter a birth date to get exact age, total days lived, and days left to the next birthday.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Age Calculator — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="../index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Home</a>
  <span class="tt-name">Age Calculator</span>
</div>
<div class="wrap">
  <h1>Age Calculator</h1>
  <p class="sub">Enter a birth date to find the exact age and days left to the next birthday.</p>

  <div class="panel">
    <label>Date of birth</label>
    <input type="date" id="dob">
    <button class="btn" id="calcBtn">Calculate age</button>
    <div class="error-text" id="ageError" style="display:none"></div>
    <div class="result" id="ageResult" style="display:none"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const calcBtn = document.getElementById('calcBtn');
const ageError = document.getElementById('ageError');
const ageResult = document.getElementById('ageResult');
calcBtn.onclick = ()=>{
  const val = document.getElementById('dob').value;
  if(!val){ showError(ageError, 'Please enter a date of birth'); ageResult.style.display='none'; return; }
  const dob = new Date(val);
  const today = new Date();
  if(dob > today){ showError(ageError, 'Date of birth cannot be in the future'); ageResult.style.display='none'; return; }
  clearMsg(ageError);

  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  let days = today.getDate() - dob.getDate();
  if(days < 0){
    months -= 1;
    const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
    days += prevMonth.getDate();
  }
  if(months < 0){ years -= 1; months += 12; }

  const totalDays = Math.floor((today - dob) / (1000*60*60*24));

  let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
  if(nextBday < today) nextBday.setFullYear(today.getFullYear()+1);
  const daysToNext = Math.ceil((nextBday - today) / (1000*60*60*24));

  ageResult.style.display='none'; void ageResult.offsetWidth; ageResult.style.display='block';
  ageResult.innerHTML = `
    <div class="stat-row"><span class="k">Age</span><span class="v">${years} yrs ${months} mo ${days} days</span></div>
    <div class="stat-row"><span class="k">Total days lived</span><span class="v">${totalDays.toLocaleString()} days</span></div>
    <div class="stat-row"><span class="k">Next birthday</span><span class="v">in ${daysToNext} days</span></div>
  `;
};
onEnter(document.getElementById('dob'), calcBtn);
</script>
</body>
</html>
