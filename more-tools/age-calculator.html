<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="জন্ম তারিখ দিয়ে সঠিক বয়স, মোট দিন আর পরের জন্মদিন কতদিন বাকি বের করার ক্যালকুলেটর।">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b'/%3E%3Ctext x='32' y='45' font-family='monospace' font-weight='700' font-size='34' fill='%23ff5a2f' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<title>বয়স ক্যালকুলেটর — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="calculators.html">← ক্যালকুলেটর</a>
  <div class="mark">FORGE.</div>
  <h1>বয়স ক্যালকুলেটর</h1>
  <p class="sub">জন্ম তারিখ দাও, সঠিক বয়স আর পরের জন্মদিন কতদিন পর জেনে নাও।</p>

  <div class="panel">
    <label>জন্ম তারিখ</label>
    <input type="date" id="dob">
    <button class="btn" id="calcBtn">বয়স বের করো</button>
    <div class="error-text" id="ageError" style="display:none"></div>
    <div class="result" id="ageResult" style="display:none"></div>
  </div>

  <footer>FORGE. — runs in your browser, nothing is uploaded</footer>
</div>

<script src="common.js"></script>
<script>
const calcBtn = document.getElementById('calcBtn');
const ageError = document.getElementById('ageError');
const ageResult = document.getElementById('ageResult');
calcBtn.onclick = ()=>{
  const val = document.getElementById('dob').value;
  if(!val){ showError(ageError, 'জন্ম তারিখ দাও'); ageResult.style.display='none'; return; }
  const dob = new Date(val);
  const today = new Date();
  if(dob > today){ showError(ageError, 'জন্ম তারিখ ভবিষ্যতের হতে পারে না'); ageResult.style.display='none'; return; }
  clearMsg(ageError);

  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  let days = today.getDate() - dob.getDate();
  if(days < 0){
    months -= 1;
    const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
    days += prevMonth.getDate();
  }
  if(months < 0){ years -= 1; months += 12; }

  const totalDays = Math.floor((today - dob) / (1000*60*60*24));

  let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
  if(nextBday < today) nextBday.setFullYear(today.getFullYear()+1);
  const daysToNext = Math.ceil((nextBday - today) / (1000*60*60*24));

  ageResult.style.display='none'; void ageResult.offsetWidth; ageResult.style.display='block';
  ageResult.innerHTML = `
    <div class="stat-row"><span class="k">বয়স</span><span class="v">${years} বছর ${months} মাস ${days} দিন</span></div>
    <div class="stat-row"><span class="k">মোট দিন বেঁচে আছো</span><span class="v">${totalDays.toLocaleString()} দিন</span></div>
    <div class="stat-row"><span class="k">পরের জন্মদিন</span><span class="v">${daysToNext} দিন পর</span></div>
  `;
};
onEnter(document.getElementById('dob'), calcBtn);
</script>
</body>
</html>
