<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free generator for Bengali boy or girl names, or business name ideas.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Name Generator — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">Name Generator</span>
</div>
<div class="wrap">
  <h1>Name Generator</h1>
  <p class="sub">Get Bengali name ideas or a business name.</p>

  <div class="panel">
    <div class="chip-row" id="nameChips">
      <div class="chip on" data-v="boy" tabindex="0" role="button">Boy</div>
      <div class="chip" data-v="girl" tabindex="0" role="button">Girl</div>
      <div class="chip" data-v="biz" tabindex="0" role="button">Business</div>
    </div>
    <button class="btn" id="nameGenBtn">Give me names</button>
    <div class="result" id="nameResult" style="display:none"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const BN_BOY = ["Ayan","Nafis","Rafsan","Arham","Jawad","Yasir","Sadman","Riyad","Tanvir","Abir","Fahim","Imtiaz"];
const BN_GIRL = ["Ayesha","Maisha","Raisa","Nafisa","Jannat","Sabiha","Tasnim","Afsana","Roza","Ilma","Fabiha","Saima"];
const BIZ_PREFIX = ["Metro","Prime","Nova","Urban","Delta","Bright","Royal","Swift","Golden","Trend","Pure","Vivid"];
const BIZ_SUFFIX = ["Mart","Hub","Bazaar","Corner","House","Traders","Point","Studio","Collection","Express"];

const boyBag = makeBag(BN_BOY);
const girlBag = makeBag(BN_GIRL);
const prefixBag = makeBag(BIZ_PREFIX);
const suffixBag = makeBag(BIZ_SUFFIX);

let mode = 'boy';
document.querySelectorAll('#nameChips .chip').forEach(c=>{
  const select = ()=>{ document.querySelectorAll('#nameChips .chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); mode=c.dataset.v; };
  c.onclick = select;
  c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(); } });
});
const nameGenBtn = document.getElementById('nameGenBtn');
nameGenBtn.onclick = ()=>{
  const res = document.getElementById('nameResult');
  res.style.display='none'; void res.offsetWidth; res.style.display='block';
  let list;
  if(mode==='boy') list = boyBag.draw(5);
  else if(mode==='girl') list = girlBag.draw(5);
  else {
    const prefixes = prefixBag.draw(5);
    const suffixes = suffixBag.draw(5);
    list = prefixes.map((p,i)=> p+' '+suffixes[i]);
  }
  res.innerHTML = list.map(n=>`<div class="name-item">${n}</div>`).join('');
};
</script>
</body>
</html>
