<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Generate a matching color palette for your design, copy any hex code with one click.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Color Palette Generator — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="../index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Home</a>
  <span class="tt-name">Color Palette Generator</span>
</div>
<div class="wrap">
  <h1>Color Palette Generator</h1>
  <p class="sub">Get 5 matching colors, ready to use in your design.</p>

  <div class="panel">
    <button class="btn" id="palGenBtn">New palette</button>
    <div class="swatches" id="palResult"></div>
    <p class="copy-hint">Click any color to copy its hex code</p>
  </div>
</div>

<script src="common.js"></script>
<script>
let lastHue = null;
function gen(){
  let baseHue = rand(360);
  if(lastHue!==null){
    let tries=0;
    while(Math.min(Math.abs(baseHue-lastHue), 360-Math.abs(baseHue-lastHue)) < 40 && tries<20){ baseHue = rand(360); tries++; }
  }
  lastHue = baseHue;
  const cols = [0,1,2,3,4].map(i=> hslToHex((baseHue + i*35)%360, 55 + rand(20), 35 + i*10));
  const wrap = document.getElementById('palResult');
  wrap.innerHTML = cols.map(c=>`<div class="swatch" style="background:${c}" data-hex="${c}" tabindex="0" role="button" title="Click to copy"><span>${c}</span></div>`).join('');
  wrap.querySelectorAll('.swatch').forEach(s=>{
    const copy = ()=>{
      navigator.clipboard && navigator.clipboard.writeText(s.dataset.hex);
      s.querySelector('span').textContent='Copied!';
      setTimeout(()=> s.querySelector('span').textContent=s.dataset.hex, 900);
    };
    s.onclick = copy;
    s.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); copy(); } });
  });
}
document.getElementById('palGenBtn').onclick = gen;
gen();
</script>
</body>
</html>
