<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ডিজাইনের জন্য মিলে যাওয়া কালার প্যালেট জেনারেটর, এক ক্লিকে হেক্স কোড কপি করা যায়।">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>কালার প্যালেট জেনারেটর — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← সব টুল</a>
  <div class="mark"><img src="../favicon.svg" alt="Forge" class="mark-icon">FORGE.</div>
  <h1>কালার প্যালেট জেনারেটর</h1>
  <p class="sub">মিলে যাওয়া ৫টা রং বের করো, ডিজাইনের জন্য ব্যবহার করো।</p>

  <div class="panel">
    <button class="btn" id="palGenBtn">নতুন প্যালেট</button>
    <div class="swatches" id="palResult"></div>
    <p class="copy-hint">কোন রং এ ক্লিক করলে হেক্স কোড কপি হয়ে যাবে</p>
  </div>

  <footer>FORGE. — runs in your browser, nothing is uploaded</footer>
</div>

<script src="common.js"></script>
<script>
let lastHue = null;
function gen(){
  let baseHue = rand(360);
  if(lastHue!==null){
    let tries=0;
    while(Math.min(Math.abs(baseHue-lastHue), 360-Math.abs(baseHue-lastHue)) < 40 && tries<20){ baseHue = rand(360); tries++; }
  }
  lastHue = baseHue;
  const cols = [0,1,2,3,4].map(i=> hslToHex((baseHue + i*35)%360, 55 + rand(20), 35 + i*10));
  const wrap = document.getElementById('palResult');
  wrap.innerHTML = cols.map(c=>`<div class="swatch" style="background:${c}" data-hex="${c}" tabindex="0" role="button" title="কপি করতে ক্লিক করো"><span>${c}</span></div>`).join('');
  wrap.querySelectorAll('.swatch').forEach(s=>{
    const copy = ()=>{
      navigator.clipboard && navigator.clipboard.writeText(s.dataset.hex);
      s.querySelector('span').textContent='কপি হয়েছে!';
      setTimeout(()=> s.querySelector('span').textContent=s.dataset.hex, 900);
    };
    s.onclick = copy;
    s.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); copy(); } });
  });
}
document.getElementById('palGenBtn').onclick = gen;
gen();
</script>
</body>
</html>
