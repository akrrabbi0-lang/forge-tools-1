<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="নাম দিয়ে স্টাইলিশ ডিজিটাল সিগনেচার বানাও, PNG হিসেবে ডাউনলোড করো।">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>সিগনেচার জেনারেটর — Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← সব টুল</a>
  <div class="mark"><img src="../favicon.svg" alt="Forge" class="mark-icon">FORGE.</div>
  <h1>সিগনেচার জেনারেটর</h1>
  <p class="sub">নাম লিখলে একটা স্টাইলিশ সিগনেচার বানিয়ে দেবে, ডাউনলোড করা যাবে।</p>

  <div class="panel">
    <label>নাম</label>
    <input type="text" id="sigName" placeholder="যেমন: Rahim Uddin">
    <button class="btn" id="sigGenBtn">সিগনেচার বানাও</button>
    <div class="error-text" id="sigError" style="display:none"></div>
    <div class="sig-wrap" id="sigResult" style="display:none">
      <canvas id="sigCanvas" width="420" height="150"></canvas>
      <button class="btn ghost" id="sigDownload">ডাউনলোড PNG</button>
    </div>
  </div>

  <footer>FORGE. — runs in your browser, nothing is uploaded</footer>
</div>

<script src="common.js"></script>
<script>
const sigGenBtn = document.getElementById('sigGenBtn');
const sigError = document.getElementById('sigError');
sigGenBtn.onclick = ()=>{
  const name = document.getElementById('sigName').value.trim();
  if(!name){ showError(sigError, 'একটা নাম লেখো'); document.getElementById('sigResult').style.display='none'; return; }
  clearMsg(sigError);
  const c = document.getElementById('sigCanvas');
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle = '#f8f6f0';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = '#111';
  ctx.font = "56px 'Caveat', cursive";
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(20, 85);
  ctx.rotate(-0.03);
  ctx.fillText(name, 0, 0);
  ctx.restore();
  document.getElementById('sigResult').style.display='flex';
};
document.getElementById('sigDownload').onclick = ()=> downloadCanvas('sigCanvas','signature.png');
onEnter(document.getElementById('sigName'), sigGenBtn);
</script>
</body>
</html>
