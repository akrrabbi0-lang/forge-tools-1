<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="যেকোনো সুডোকু পাজল সেকেন্ডে সলভ করে দেওয়ার ফ্রি টুল।">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b'/%3E%3Ctext x='32' y='45' font-family='monospace' font-weight='700' font-size='34' fill='%23ff5a2f' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<title>সুডোকু সলভার — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← সব টুল</a>
  <div class="mark">FORGE.</div>
  <h1>সুডোকু সলভার</h1>
  <p class="sub">যে সংখ্যাগুলো জানা আছে সেগুলো বসাও, বাকিগুলো খালি রাখো — সলভ করলে পুরো গ্রিড ভরে দেবে।</p>

  <div class="panel">
    <div class="sudoku" id="grid"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="solveBtn">সলভ করো</button>
      <button class="btn ghost" id="clearBtn" type="button">খালি করো</button>
      <button class="btn ghost" id="exampleBtn" type="button">উদাহরণ</button>
    </div>
    <div class="result" id="sudokuMsg" style="display:none"></div>
  </div>

  <footer>FORGE. — runs in your browser, nothing is uploaded</footer>
</div>

<script src="common.js"></script>
<script>
const grid = document.getElementById('grid');
const cells = [];
for(let r=0;r<9;r++){
  cells.push([]);
  for(let c=0;c<9;c++){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.maxLength = 1;
    inp.inputMode = 'numeric';
    inp.className = (c%3===2 && c!==8 ? 'thick-r ' : '') + (r%3===2 && r!==8 ? 'thick-b' : '');
    inp.addEventListener('input', ()=>{
      inp.value = inp.value.replace(/[^1-9]/g,'').slice(0,1);
    });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('solveBtn').click(); } });
    grid.appendChild(inp);
    cells[r].push(inp);
  }
}

const EXAMPLE = [
  "53..7....","6..195...",".98....6.","8...6...3","4..8.3..1","7...2...6",".6....28.","...419..5","....8..79"
];

document.getElementById('exampleBtn').onclick = ()=>{
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const ch = EXAMPLE[r][c];
    cells[r][c].value = ch==='.' ? '' : ch;
    cells[r][c].classList.toggle('given', ch!=='.');
  }
  document.getElementById('sudokuMsg').style.display='none';
};
document.getElementById('clearBtn').onclick = ()=>{
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){ cells[r][c].value=''; cells[r][c].classList.remove('given'); }
  document.getElementById('sudokuMsg').style.display='none';
};

function readBoard(){
  const b = [];
  for(let r=0;r<9;r++){
    b.push([]);
    for(let c=0;c<9;c++){
      const v = cells[r][c].value.trim();
      b[r].push(v ? parseInt(v) : 0);
    }
  }
  return b;
}

function isValid(b, r, c, val){
  for(let i=0;i<9;i++){
    if(b[r][i]===val) return false;
    if(b[i][c]===val) return false;
  }
  const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    if(b[br+i][bc+j]===val) return false;
  }
  return true;
}

function solveBoard(b){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if(b[r][c]===0){
        for(let val=1; val<=9; val++){
          if(isValid(b,r,c,val)){
            b[r][c]=val;
            if(solveBoard(b)) return true;
            b[r][c]=0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

const solveBtn = document.getElementById('solveBtn');
solveBtn.onclick = ()=>{
  const board = readBoard();
  const msg = document.getElementById('sudokuMsg');
  solveBtn.disabled = true;
  solveBtn.innerHTML = '<span class="spinner"></span>সলভ হচ্ছে...';
  setTimeout(()=>{
    const solved = solveBoard(board);
    solveBtn.disabled = false;
    solveBtn.textContent = 'সলভ করো';
    if(!solved){
      msg.className = 'error-text';
      msg.style.display='block';
      msg.textContent = 'এই পাজলটা সলভ করা যাচ্ছে না — সংখ্যাগুলো আবার চেক করো।';
      return;
    }
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) cells[r][c].value = board[r][c];
    msg.style.display='none';
  }, 30);
};
</script>
</body>
</html>
