<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free tool that solves any sudoku puzzle in seconds.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Sudoku Solver — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">Sudoku Solver</span>
</div>
<div class="wrap">
  <h1>Sudoku Solver</h1>
  <p class="sub">Enter the numbers you already know, leave the rest blank — solving fills in the whole grid.</p>

  <div class="panel">
    <div class="sudoku" id="grid"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="solveBtn">Solve</button>
      <button class="btn ghost" id="clearBtn" type="button">Clear</button>
      <button class="btn ghost" id="exampleBtn" type="button">Example</button>
    </div>
    <div class="result" id="sudokuMsg" style="display:none"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const grid = document.getElementById('grid');
const cells = [];
for(let r=0;r<9;r++){
  cells.push([]);
  for(let c=0;c<9;c++){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.maxLength = 1;
    inp.inputMode = 'numeric';
    inp.className = (c%3===2 && c!==8 ? 'thick-r ' : '') + (r%3===2 && r!==8 ? 'thick-b' : '');
    inp.addEventListener('input', ()=>{
      inp.value = inp.value.replace(/[^1-9]/g,'').slice(0,1);
    });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('solveBtn').click(); } });
    grid.appendChild(inp);
    cells[r].push(inp);
  }
}

const EXAMPLE = [
  "53..7....","6..195...",".98....6.","8...6...3","4..8.3..1","7...2...6",".6....28.","...419..5","....8..79"
];

document.getElementById('exampleBtn').onclick = ()=>{
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const ch = EXAMPLE[r][c];
    cells[r][c].value = ch==='.' ? '' : ch;
    cells[r][c].classList.toggle('given', ch!=='.');
  }
  document.getElementById('sudokuMsg').style.display='none';
};
document.getElementById('clearBtn').onclick = ()=>{
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){ cells[r][c].value=''; cells[r][c].classList.remove('given'); }
  document.getElementById('sudokuMsg').style.display='none';
};

function readBoard(){
  const b = [];
  for(let r=0;r<9;r++){
    b.push([]);
    for(let c=0;c<9;c++){
      const v = cells[r][c].value.trim();
      b[r].push(v ? parseInt(v) : 0);
    }
  }
  return b;
}

function isValid(b, r, c, val){
  for(let i=0;i<9;i++){
    if(b[r][i]===val) return false;
    if(b[i][c]===val) return false;
  }
  const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    if(b[br+i][bc+j]===val) return false;
  }
  return true;
}

function solveBoard(b){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if(b[r][c]===0){
        for(let val=1; val<=9; val++){
          if(isValid(b,r,c,val)){
            b[r][c]=val;
            if(solveBoard(b)) return true;
            b[r][c]=0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

const solveBtn = document.getElementById('solveBtn');
solveBtn.onclick = ()=>{
  const board = readBoard();
  const msg = document.getElementById('sudokuMsg');
  solveBtn.disabled = true;
  solveBtn.innerHTML = '<span class="spinner"></span>Solving...';
  setTimeout(()=>{
    const solved = solveBoard(board);
    solveBtn.disabled = false;
    solveBtn.textContent = 'Solve';
    if(!solved){
      msg.className = 'error-text';
      msg.style.display='block';
      msg.textContent = "This puzzle can't be solved — double check the numbers.";
      return;
    }
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) cells[r][c].value = board[r][c];
    msg.style.display='none';
  }, 30);
};
</script>
</body>
</html>
