<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free tool to type text and hear it read aloud using your browser's own voices.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Text to Speech — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">Text to Speech</span>
</div>
<div class="wrap">
  <h1>Text to Speech</h1>
  <p class="sub">Type text and listen to it — using your browser's own voice, nothing is uploaded.</p>

  <div class="panel">
    <label>Text</label>
    <textarea id="ttsText" placeholder="Type what you want read out loud..." rows="5"></textarea>
    <label>Voice</label>
    <select id="ttsVoice"></select>
    <div class="row">
      <div><label>Speed</label><input type="range" id="ttsRate" min="0.5" max="2" step="0.1" value="1"></div>
      <div><label>Pitch</label><input type="range" id="ttsPitch" min="0" max="2" step="0.1" value="1"></div>
    </div>
    <div class="voice-row">
      <button class="btn" id="playBtn">▶ Play</button>
      <button class="btn ghost" id="stopBtn" type="button">■ Stop</button>
    </div>
    <div class="error-text" id="ttsError" style="display:none"></div>
    <p class="muted-note" id="ttsNote"></p>
  </div>
</div>

<script src="common.js"></script>
<script>
const synth = window.speechSynthesis;
const voiceSelect = document.getElementById('ttsVoice');
const note = document.getElementById('ttsNote');
const ttsError = document.getElementById('ttsError');
const ttsTextEl = document.getElementById('ttsText');

if(!synth){
  note.textContent = "Sorry, your browser doesn't support text-to-speech.";
  document.getElementById('playBtn').disabled = true;
} else {
  function loadVoices(){
    const voices = synth.getVoices();
    voiceSelect.innerHTML = voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
    if(voices.length===0){
      note.textContent = 'Loading voices... please wait a moment.';
    } else {
      note.textContent = `${voices.length} voices found. Available voices vary by device/browser.`;
    }
  }
  loadVoices();
  if(synth.onvoiceschanged !== undefined){ synth.onvoiceschanged = loadVoices; }

  document.getElementById('playBtn').onclick = ()=>{
    const text = ttsTextEl.value.trim();
    if(!text){ showError(ttsError, 'Please type some text'); return; }
    clearMsg(ttsError);
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voices = synth.getVoices();
    const idx = parseInt(voiceSelect.value);
    if(voices[idx]) utter.voice = voices[idx];
    utter.rate = parseFloat(document.getElementById('ttsRate').value);
    utter.pitch = parseFloat(document.getElementById('ttsPitch').value);
    synth.speak(utter);
  };
  document.getElementById('stopBtn').onclick = ()=> synth.cancel();
  ttsTextEl.addEventListener('keydown', e=>{
    if(e.key==='Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); document.getElementById('playBtn').click(); }
  });
}
</script>
</body>
</html>
