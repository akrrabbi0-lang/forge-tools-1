<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Generator for a funny excuse when you're late for work or school.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Excuse Generator — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">Excuse Generator</span>
</div>
<div class="wrap">
  <h1>Excuse Generator</h1>
  <p class="sub">Just for fun — an excuse for when you're late for work or school!</p>

  <div class="panel">
    <div class="chip-row" id="excChips">
      <div class="chip on" data-v="office" tabindex="0" role="button">Work</div>
      <div class="chip" data-v="school" tabindex="0" role="button">School/College</div>
    </div>
    <button class="btn" id="excGenBtn">Give me an excuse</button>
    <div class="result" id="excResult" style="display:none"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const EXCUSES = {
  office: ["Traffic was brutal, that's why I'm late.","Sudden stomach ache, had to see a doctor.","Couldn't send the email because of an internet issue.","A water pipe burst at home, had to get it fixed.","The car wouldn't start, had to call a mechanic."],
  school: ["Fell asleep studying last night and forgot my notebook.","Guests showed up at home out of nowhere, had no time to study.","The printer broke while I was printing the assignment.","My younger sibling was sick, had to look after them.","The computer restarted on its own and the file didn't save."]
};
const excuseBags = { office: makeBag(EXCUSES.office), school: makeBag(EXCUSES.school) };

let mode='office';
document.querySelectorAll('#excChips .chip').forEach(c=>{
  const select = ()=>{ document.querySelectorAll('#excChips .chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); mode=c.dataset.v; };
  c.onclick = select;
  c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(); } });
});
document.getElementById('excGenBtn').onclick = ()=>{
  const res = document.getElementById('excResult');
  res.style.display='none'; void res.offsetWidth; res.style.display='block';
  res.innerHTML = `<div class="name-item">${excuseBags[mode].draw()}</div>`;
};
</script>
</body>
</html>
