<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Work out your GPA or CGPA from course credits and grades.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>GPA / CGPA Calculator — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="calculators.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">GPA / CGPA Calculator</span>
</div>
<div class="wrap">
  <h1>GPA / CGPA Calculator</h1>
  <p class="sub">Enter each course's credit and grade to get a weighted GPA (4.00 scale).</p>

  <div class="panel">
    <div class="receipt-lines" id="gLines"></div>
    <button class="btn ghost" id="gAddLine" type="button">+ Add course</button>
    <button class="btn" id="gCalcBtn">Calculate GPA</button>
    <div class="result" id="gResult" style="display:none"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const GRADE_POINTS = {'A+':4.00,'A':3.75,'A-':3.50,'B+':3.25,'B':3.00,'B-':2.75,'C+':2.50,'C':2.25,'D':2.00,'F':0.00};
const linesWrap = document.getElementById('gLines');
const gCalcBtn = document.getElementById('gCalcBtn');

function addLine(){
  const row = document.createElement('div');
  row.className='receipt-line';
  const opts = Object.keys(GRADE_POINTS).map(g=>`<option value="${g}">${g}</option>`).join('');
  row.innerHTML = `<input type="text" placeholder="Course name (optional)" class="cname">
    <input type="number" placeholder="Credit" class="credit amt" step="0.5">
    <select class="grade">${opts}</select>
    <button type="button" class="remove-row-btn" title="Remove">✕</button>`;
  row.querySelector('.remove-row-btn').onclick = ()=>{
    if(linesWrap.children.length > 1) row.remove();
  };
  onEnter([row.querySelector('.cname'), row.querySelector('.credit')], gCalcBtn);
  linesWrap.appendChild(row);
}
addLine(); addLine(); addLine();
document.getElementById('gAddLine').onclick = addLine;

gCalcBtn.onclick = ()=>{
  const rows = Array.from(linesWrap.querySelectorAll('.receipt-line'));
  let totalCredit = 0, totalPoints = 0;
  rows.forEach(r=>{
    const credit = parseFloat(r.querySelector('.credit').value) || 0;
    const grade = r.querySelector('.grade').value;
    if(credit > 0){
      totalCredit += credit;
      totalPoints += credit * GRADE_POINTS[grade];
    }
  });
  const res = document.getElementById('gResult');
  res.style.display='none'; void res.offsetWidth; res.style.display='block';
  if(totalCredit === 0){
    res.className = 'error-text';
    res.innerHTML = `Enter credit for at least one course`;
    return;
  }
  res.className = 'result';
  const gpa = totalPoints / totalCredit;
  res.innerHTML = `
    <div class="stat-row"><span class="k">Total credits</span><span class="v">${totalCredit}</span></div>
    <div class="stat-row"><span class="k">GPA / CGPA</span><span class="v">${gpa.toFixed(2)}</span></div>
  `;
};
</script>
</body>
</html>
