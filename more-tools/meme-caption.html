<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Funny meme caption generator — customize it with your friends' names.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Meme Caption Generator — Forge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tool-topbar">
  <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
  <span class="tt-name">Meme Caption Generator</span>
</div>
<div class="wrap">
  <h1>Meme Caption Generator</h1>
  <p class="sub">Give me a name, I'll build a funny caption.</p>

  <div class="panel">
    <label>Name (optional)</label>
    <input type="text" id="memeName" placeholder="e.g. Rafi">
    <button class="btn" id="memeBtn">Give me a caption</button>
    <div class="result" id="memeResult" style="display:none"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const MEME_TEMPLATES = [
  n => `When ${n} says "coming in 5 minutes" and shows up 2 hours later`,
  n => `${n}: I'm on a diet\nSame ${n}: halfway through a plate of biryani`,
  n => `The moment mom calls, ${n} suddenly remembers every unfinished chore`,
  n => `${n} checking the bank balance at the end of the month`,
  n => `Everyone: go to sleep\n${n}: just one more episode, I promise`,
  n => `${n}'s phone is at 1% battery and still can't stop scrolling reels`
];
const memeBag = makeBag(MEME_TEMPLATES);
document.getElementById('memeBtn').onclick = ()=>{
  const name = document.getElementById('memeName').value.trim() || 'me';
  const res = document.getElementById('memeResult');
  res.style.display='none'; void res.offsetWidth; res.style.display='block';
  res.innerHTML = `<div class="name-item" style="white-space:pre-line">${memeBag.draw()(name)}</div>`;
};
onEnter(document.getElementById('memeName'), document.getElementById('memeBtn'));
</script>
</body>
</html>
