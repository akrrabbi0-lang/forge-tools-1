<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-W7D5ZTED2S"></script>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free QR Code Generator Online — Download PNG | Forge</title>
<meta name="description" content="Generate a scannable QR code from any link or text for free. Choose your size and download the PNG instantly. No sign-up, no watermark.">
<link rel="canonical" href="https://REPLACE_WITH_YOUR_DOMAIN/qr-generator.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="tool-page">

<div class="tool-topbar">
  <a class="back-btn" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Home
  </a>
  <span class="tt-name">QR Generator</span>
</div>

<div class="tool-body">
<section class="tool-panel" id="tool-qr">
      <h2>QR Code Generator</h2>
      <p class="desc" id="qr-desc">Type a link or any text, and a scannable QR code appears instantly.</p>
      <div class="field" id="qr-input-field">
        <label>Link or text</label>
        <input type="text" id="qr-input" placeholder="https://example.com">
      </div>
      <div class="row" style="margin-bottom:8px;" id="qr-size-field">
        <div class="field" style="max-width:180px;">
          <label>Size (px)</label>
          <select id="qr-size">
            <option value="200">200</option>
            <option value="300" selected>300</option>
            <option value="400">400</option>
            <option value="500">500</option>
          </select>
        </div>
      </div>
      <button class="action brass" id="qr-generate">Generate QR code</button>
      <div id="qr-canvas-wrap" class="hidden"><div id="qr-canvas"></div></div>
      <div style="margin-top:16px;">
        <button class="action hidden" id="qr-download">Download PNG</button>
      </div>
      <p id="qr-back-link" class="hidden" style="margin-top:20px;"><a href="qr-generator.html" style="color:var(--brass-dim); font-family:'Space Grotesk',sans-serif; font-weight:500;">Make a different QR code →</a></p>
    </section>
</div>

<script>
/* ---------- QR GENERATOR ---------- */
function renderQr(val, size){
  const wrap = document.getElementById('qr-canvas');
  wrap.innerHTML = '';
  new QRCode(wrap, {
    text: val,
    width: size,
    height: size,
    colorDark: "#1B2430",
    colorLight: "#ffffff",
  });
  document.getElementById('qr-canvas-wrap').classList.remove('hidden');
  document.getElementById('qr-download').classList.remove('hidden');
}

document.getElementById('qr-generate').addEventListener('click', ()=>{
  const val = document.getElementById('qr-input').value.trim();
  if(!val) return;
  const size = parseInt(document.getElementById('qr-size').value);
  renderQr(val, size);
});
document.getElementById('qr-download').addEventListener('click', ()=>{
  const canvas = document.querySelector('#qr-canvas canvas');
  if(!canvas) return;
  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

/* If arriving from a Memo's "Generate QR code" action, auto-render a QR
   for that memo without exposing the internal link format to the user. */
(function(){
  const params = new URLSearchParams(location.search);
  const memoId = params.get('memo');
  if(memoId){
    document.getElementById('qr-desc').textContent = 'Scan this with the Scan tool on this site to open the memo on this device.';
    document.getElementById('qr-input-field').classList.add('hidden');
    document.getElementById('qr-size-field').classList.add('hidden');
    document.getElementById('qr-generate').classList.add('hidden');
    document.getElementById('qr-back-link').classList.remove('hidden');
    renderQr('FORGEMEMO:v1:' + memoId, 300);
  }
})();
</script>

</body>
</html>
